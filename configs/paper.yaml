# Paper-scale reference configuration (arXiv:2508.18486, Table 3 + Sec. 2.2).
# Requires multi-GPU training, the full observation archive (satellite L1B
# channels from EUMETSAT/NOAA via registration) and nside=64-compatible SHT
# (torch-harmonics backend) -- provided for scale-up, not for the pilot.
run_name: paper
output_dir: runs/paper
device: cuda
grid:
  nside: 64         # 24576 pixels (~1 deg)
  lmax: 179         # paper Sec. A.2
model:
  hidden: 512
  blocks: 12
  k_filters: 15     # paper: 12-fold filter compression
  swin_window: 7    # paper: standard Swin window
  heads: 8
  mlp_ratio: 4.0
  noise_dim: 16
  noise_embed_dim: 128
  degree_freqs: 32
data:
  source: era5
  root: data
  variables:
    upper: [z, t, u, v, q]
    levels: [50, 100, 150, 200, 250, 300, 400, 500, 600, 700, 850, 925, 1000]
    surface: [2t, 2d, 10u, 10v, tcc, tcwv, msl]
  obs:
    enabled: true
    # paper Table 2: 269 channels incl. satellite radiances + metadata;
    # the satellite channels require the registration-gated archives.
    surface_vars: [2t, 2d, 10u, 10v, tcc, msl]
  train_period: [0, 87672]     # 1979-2014 ERA5 (36 years)
  val_period: [87672, 88088]
train:
  batch_size: 16
  ensemble: 2
  num_workers: 8
  phases:      # paper Table 3
    deterministic: {steps: 347000, lr: 5e-4, loss: l1, rollout: 0, noise: false}
    stochastic:  {steps: 149000, lr: 2e-4, loss: crps, rollout: 0, noise: true,
                  init: deterministic}
    fcst_ar:     {steps: 14000, lr: 3e-6, loss: crps, rollout: 6, noise: true,
                  schedule: constant, init: stochastic}
    assim:       {steps: 46000, lr: 2e-4, loss: crps, rollout: 8, noise: true,
                  obs: true, init: stochastic}
    joint:       {steps: 13000, lr: 3e-6, loss: crps, rollout_assim: 8,
                  rollout_fcst: 8, noise: true, obs: true, init: assim,
                  fcst_init: fcst_ar}
    hybrid:      {steps: 2700, lr: 3e-6, loss: crps, rollout: 6, noise: true,
                  schedule: constant, init: fcst_ar}
eval:
  members: 48
  spinup_steps: 720     # >= 3 months of 4x-daily cycling
  lead_steps: 20        # 10 days
