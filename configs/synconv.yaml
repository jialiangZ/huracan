# Synthetic convergence check: same pipeline as smoke but with realistic
# step counts, run on the free GPU to verify actual learning (loss down,
# CRPS competitive with climatology/persistence).
run_name: synconv
output_dir: runs/synconv
device: cuda
grid:
  nside: 8
  lmax: 12
model:
  hidden: 64
  blocks: 3
  k_filters: 6
  swin_window: 4
  heads: 2
  mlp_ratio: 2.0
  noise_dim: 8
  noise_embed_dim: 48
data:
  source: synthetic
  root: data
  variables:
    upper: [z, t, u, v, q]
    levels: [300, 500, 850]
    surface: [2t, 2d, 10u, 10v, tcc, tcwv, msl]
  obs:
    enabled: true
  train_period: [0, 3000]
  val_period: [3000, 3950]
  synthetic:
    channels: 22
    steps: 4000
train:
  batch_size: 16
  ensemble: 2
  num_workers: 4
  phases:
    deterministic: {steps: 2500, lr: 5e-4, loss: l1, rollout: 0, noise: false}
    stochastic:  {steps: 1200, lr: 2e-4, loss: crps, rollout: 0, noise: true,
                  init: deterministic}
    fcst_ar:     {steps: 400, lr: 1e-5, loss: crps, rollout: 4, noise: true,
                  schedule: constant, init: stochastic}
    assim:       {steps: 800, lr: 5e-5, loss: crps, rollout: 4, noise: true,
                  obs: true, init: stochastic}
    joint:       {steps: 400, lr: 1e-5, loss: crps, rollout_assim: 4,
                  rollout_fcst: 4, noise: true, obs: true, init: assim,
                  fcst_init: fcst_ar}
eval:
  members: 4
  spinup_steps: 40
  lead_steps: 12
